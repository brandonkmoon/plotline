name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run
      - name: Lint
        # Non-blocking: ESLint now runs (Next 16 removed `next lint`), but it
        # surfaces a pre-existing backlog of ~30 findings to triage separately.
        run: npm run lint
        continue-on-error: true
